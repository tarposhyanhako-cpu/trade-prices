name: Update trade prices

on:
  schedule:
    - cron: "17 4 5 * *"   # 04:17 UTC on the 5th of every month
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["R/build.R", "R/fetch.R", ".github/workflows/update.yml", "site/**", "data/ref/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages
        run: Rscript -e 'install.packages(c("httr2", "jsonlite", "data.table", "openxlsx", "R.utils"))'
      - name: Download new months from UN Comtrade
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
        run: Rscript R/fetch.R
      - name: Save downloaded data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Raw data update $(date -u +%Y-%m-%d)" || echo "No new raw data"
          git pull --rebase && git push
      - name: Calculate average prices
        run: Rscript R/build.R
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
