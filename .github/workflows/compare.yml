name: Download comparison data

on:
  schedule:
    - cron: "23 2 * * *"   # every day until complete, then it only checks
  push:
    branches: [main]
    paths: ["R/fetch_compare.R"]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages
        run: Rscript -e 'install.packages(c("httr2", "jsonlite", "data.table", "openxlsx", "R.utils"))'
      - name: Download other countries' yearly trade (stops at the daily limit)
        continue-on-error: true   # if the UN limit is reached, still rebuild with the data we have
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
          MAX_CALLS: ${{ github.event_name == 'push' && '120' || '440' }}
        run: Rscript R/fetch_compare.R
      - name: Save downloaded data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/compare
          git commit -m "Comparison data $(date -u +%Y-%m-%d)" || echo "No new data"
          git pull --rebase && git push
      - name: Calculate page data
        run: Rscript R/build.R
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: compare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
