<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Արտահանման և ներմուծման գներ · Հայաստան</title>
<style>
@font-face{font-family:Inter;src:url(vendor/fonts/inter-latin-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:Inter;src:url(vendor/fonts/inter-latin-600-normal.woff2) format('woff2');font-weight:600}
@font-face{font-family:Inter;src:url(vendor/fonts/inter-latin-700-normal.woff2) format('woff2');font-weight:700}
:root{
  --bg:#FFFFFF;--text:#0D2B33;--line:#D7E2E3;--pale:#F0F7F7;
  --accent:#0FA3A3;--accent-d:#0B7F80;--accent-l:#BDE5E2;--accent2:#B8264A;
  --land:#E8EEEF;--edge:#FFFFFF;--arm:#0D2B33;--ramp0:#CFEEEB;--ramp1:#0A6E70;
  --arc:#0A6E70;--arc-op:.45;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans Armenian","Arial Armenian",-apple-system,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
h2{font-size:18px;font-weight:700;margin:0}

/* top bar */
.top{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:20}
.top .in{max-width:1240px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.brand .mark{width:24px;height:24px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center}
.brand .mark i{width:8px;height:8px;border-radius:50%;background:#fff;display:block}
.mode{display:flex;gap:4px;height:100%}
.mode button{border:0;background:none;padding:0 12px;cursor:pointer;font-size:15px;font-weight:600;border-bottom:3px solid transparent;height:100%}
.mode button.on{border-color:var(--accent);color:var(--accent-d)}
.lang{margin-left:auto;display:flex;gap:2px;border:1px solid var(--line);border-radius:10px;padding:3px}
.lang button{border:0;background:none;padding:5px 10px;cursor:pointer;font-size:13px;font-weight:700;border-radius:7px}
.lang button.on{background:var(--text);color:#fff}

.wrap{max-width:1240px;margin:0 auto;padding:24px 24px 50px}

/* search */
.find{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.q{position:relative}
.q input{width:100%;height:52px;border:1.5px solid var(--text);border-radius:12px;padding:0 16px 0 46px;font-size:16px;outline:none;background:#fff}
.q input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(15,163,163,.15)}
.q svg{position:absolute;left:16px;top:16px}
.q svg *{stroke:var(--text)}
.list{position:absolute;left:0;right:0;top:58px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(13,43,51,.14);max-height:420px;overflow:auto;z-index:30;display:none}
.list div{padding:10px 16px;cursor:pointer;display:flex;gap:14px;align-items:baseline;border-bottom:1px solid var(--line)}
.list div:hover,.list div.on{background:var(--pale)}
.list b{min-width:60px;font-weight:700;font-variant-numeric:tabular-nums}
.list span{flex:1}
.list em{font-style:normal;font-size:13px;white-space:nowrap}
.seg{display:flex;background:var(--pale);border-radius:12px;padding:4px}
.seg button{border:0;background:none;height:44px;padding:0 22px;border-radius:9px;cursor:pointer;font-size:15px;font-weight:600}
.seg button.on{background:var(--accent);color:#fff}
.seg button:disabled{opacity:.3;cursor:not-allowed}
.seg.sm{display:inline-flex;padding:3px}.seg.sm button{height:30px;padding:0 14px;font-size:13px}

/* answer */
.answer{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap;margin:24px 0 18px}
.pname{font-size:20px;font-weight:700;margin-bottom:8px;max-width:760px}
.pname .code{display:inline-block;background:var(--pale);border-radius:6px;padding:1px 8px;margin-right:8px;font-size:15px;font-variant-numeric:tabular-nums;vertical-align:2px}
.price{font-size:56px;font-weight:700;letter-spacing:-.02em;line-height:1;color:var(--accent-d);font-variant-numeric:tabular-nums}
.price small{font-size:18px;font-weight:600;color:var(--text);margin-left:8px;letter-spacing:0}
.plabel{font-size:14px;margin-top:8px}
.facts{display:flex;gap:30px}
.facts div{font-size:13px}
.facts b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}

/* board */
.board{display:grid;grid-template-columns:1fr 290px;gap:18px}
.board.full{grid-template-columns:1fr}
.mapbox{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#FAFCFC;height:520px}
#map{width:100%;height:100%;display:block;cursor:grab;outline:none}
#map:active{cursor:grabbing}
.country{fill:var(--land);stroke:var(--edge);stroke-width:.7px;vector-effect:non-scaling-stroke}
.country.has{cursor:pointer}
.country.has:hover{stroke:var(--text);stroke-width:1.2px}
.country.arm{fill:var(--arm)}
.country.off{fill:#F7F9F9;stroke:var(--line);stroke-dasharray:3 2}
.country.dest{fill:var(--accent2)!important}
.arc{fill:none;stroke:var(--arc);stroke-opacity:var(--arc-op);stroke-linecap:round;vector-effect:non-scaling-stroke;cursor:pointer}
.arc:hover,.arc.hi{stroke:var(--accent);stroke-opacity:1}
.flow{fill:none;stroke:#fff;stroke-opacity:.95;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:1 14;animation:flow 7s linear infinite;pointer-events:none}
.flow.rev{animation-direction:reverse}
@keyframes flow{to{stroke-dashoffset:-150}}
.dot{fill:var(--accent);stroke:#fff;stroke-width:1.5px;vector-effect:non-scaling-stroke;pointer-events:none}
.home{fill:#fff;stroke:var(--arm);stroke-width:3px;vector-effect:non-scaling-stroke}
.homepulse{fill:none;stroke:var(--arm);stroke-width:1.5px;vector-effect:non-scaling-stroke;animation:pulse 2.6s ease-out infinite;pointer-events:none}
@keyframes pulse{from{opacity:.8}to{opacity:0}}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;font-size:17px;line-height:1}
.zoom button:hover{border-color:var(--text)}
.legend{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;display:flex;gap:18px;align-items:flex-end}
.legend .ramp{width:120px;height:8px;border-radius:4px;margin:5px 0 3px}
.legend .ends{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.legend svg{display:block;margin-top:5px}
.legend line{stroke:var(--arc);stroke-opacity:.5}
.empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:16px;background:rgba(255,255,255,.75)}
.tip{position:fixed;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(13,43,51,.16);padding:12px 14px;font-size:13px;min-width:210px;opacity:0;transition:opacity .12s;z-index:40}
.tip h4{margin:0 0 6px;font-size:15px}
.tip .tp{font-size:26px;font-weight:700;color:var(--accent-d);line-height:1.1;font-variant-numeric:tabular-nums}
.tip .tp small{font-size:12px;color:var(--text);font-weight:600}
.tip table{border-collapse:collapse;margin-top:6px;width:100%}
.tip td{padding:2px 0;font-variant-numeric:tabular-nums}
.tip td+td{text-align:right;padding-left:14px;font-weight:600}
.tip .act{margin-top:7px;font-size:12px;color:var(--accent-d);font-weight:600}

/* filters */
.filters{border:1px solid var(--line);border-radius:16px;padding:14px 16px;height:520px;overflow:auto}
.filters h3{margin:0 0 4px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.filters h3 button{border:0;background:none;color:var(--accent-d);cursor:pointer;font-size:13px;font-weight:700;padding:0}
.fg{border-top:1px solid var(--line);padding:12px 0 12px}
.fg:first-of-type{border-top:0}
.fg label.t{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}
.chips button.on{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:#fff;font-size:14px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:700;margin-bottom:8px;cursor:pointer}
.sw input{display:none}
.sw i{width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i:after{left:19px}
.note{font-size:13px;line-height:1.45}

/* sections below */
.block{margin-top:26px;border-top:2px solid var(--text);padding-top:14px}
.bh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.bh .sub{font-size:13px;margin-top:2px}
.tsgrid{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.tsgrid h4{margin:4px 0 2px;font-size:14px;font-weight:700}
.tsgrid svg{display:block;width:100%;height:220px}
.tsgrid .bar{fill:var(--accent-l)}.tsgrid .bar.sel{fill:var(--accent)}.tsgrid .bar:hover{fill:var(--accent-d)}
.tsgrid .ax text{font-size:12px;fill:var(--text)}.tsgrid .ax line{stroke:var(--line)}
table.ct{width:100%;border-collapse:collapse;font-size:14px}
.ct th{text-align:left;font-weight:700;border-bottom:1.5px solid var(--text);padding:8px 8px;white-space:nowrap}
.ct th[data-s]{cursor:pointer}
.ct th[data-s].on{color:var(--accent-d)}
.ct td{border-bottom:1px solid var(--line);padding:8px 8px;font-variant-numeric:tabular-nums;cursor:pointer}
.ct td.n,.ct th.n{text-align:right}
.ct tr:hover td{background:var(--pale)}
.ct tr.off td{opacity:.4;text-decoration:line-through}
.ct td:first-child,.ct th:first-child{width:28px;padding-right:0}
.ct .ck{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--text);display:inline-block;vertical-align:-2px;position:relative}
.ct tr:not(.off) .ck{background:var(--accent);border-color:var(--accent)}
.ct tr:not(.off) .ck:after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.ct td.pb{width:34%}
.ct .bar{display:inline-block;height:9px;background:var(--accent-l);border-radius:5px;vertical-align:middle}
.ct tr.arm td{font-weight:700;color:var(--accent-d)}
.ct tr.arm .bar{background:var(--accent)}
.ct tr.reg td.nm:after{content:" ●";color:var(--accent2);font-size:10px;vertical-align:2px}
.more{margin-top:10px;border:1.5px solid var(--text);background:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;font-size:14px;font-weight:600}

/* compare */
.cmptop{margin:22px 0 18px}
.cmpctl{display:flex;gap:12px;margin:12px 0 16px;flex-wrap:wrap}
.cmpctl label{font-size:13px;font-weight:700;display:block;margin-bottom:4px}
.cmpctl select{min-width:220px;height:40px}
.cmpbig{display:flex;gap:40px;align-items:flex-end;flex-wrap:wrap}
.cmpbig .lab{font-size:14px;margin-bottom:6px}
.cmpbig .v{font-size:52px;font-weight:700;color:var(--accent-d);line-height:1;font-variant-numeric:tabular-nums}
.cmpbig .v small{font-size:17px;color:var(--text);font-weight:600;margin-left:6px}
.cmpbig .o{font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.cmpbig .o small{font-size:15px;font-weight:600;margin-left:6px}
.cmpbig .rk{font-size:15px;font-weight:600;padding-bottom:4px}
.msg{padding:18px 0;font-size:15px}

footer{margin-top:34px;border-top:1px solid var(--line);padding-top:14px;font-size:13px;line-height:1.6}
footer a{color:var(--accent-d);font-weight:600}
.hide{display:none!important}
.noanim *{transition:none!important}
@media(max-width:960px){.board{grid-template-columns:1fr}.filters{height:auto}.mapbox{height:420px}.find{grid-template-columns:1fr}.tsgrid{grid-template-columns:1fr}.price{font-size:44px}.top .in{gap:14px}.brand span+span{display:none}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><span class="mark"><i></i></span><span data-t="brand"></span></div>
  <nav class="mode"><button id="mP" class="on" data-t="m_price"></button><button id="mC" data-t="m_cmp"></button></nav>
  <div class="lang"><button id="lhy" class="on">ՀԱՅ</button><button id="len">ENG</button></div>
</div></header>

<main class="wrap">
  <div class="find">
    <div class="q">
      <svg width="20" height="20" viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="6.5" fill="none" stroke-width="2"/><path d="M13.5 13.5 L18 18" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" autocomplete="off">
      <div class="list" id="list"></div>
    </div>
    <div class="seg"><button id="fX" data-t="export"></button><button id="fM" data-t="import"></button></div>
  </div>

  <section class="answer" id="answer"></section>
  <section class="cmptop hide" id="cmptop"></section>

  <div class="board" id="board">
    <div class="mapbox" id="mapbox">
      <svg id="map"></svg>
      <div class="zoom"><button id="zin">+</button><button id="zout">−</button><button id="zfit">⤢</button></div>
      <div class="legend" id="legend"></div>
      <div class="empty" id="empty"></div>
    </div>
    <aside class="filters" id="filters">
      <h3><span data-t="filters"></span><button id="reset" data-t="reset"></button></h3>
      <div class="fg">
        <label class="t" data-t="period"></label>
        <div class="chips" id="pchips"></div>
        <div class="two"><select id="from"></select><select id="to"></select></div>
      </div>
      <div class="fg">
        <label class="sw"><span data-t="outliers"></span><input type="checkbox" id="out" checked><i></i></label>
        <select id="outk"></select>
        <div class="note" id="outnote" style="margin-top:6px"></div>
      </div>
      <div class="fg">
        <label class="t" data-t="small"></label>
        <select id="minkg"></select>
      </div>
      <div class="fg note" data-t="exclnote"></div>
    </aside>
  </div>

  <section class="block" id="tsblock">
    <div class="bh"><div><h2 id="tstitle"></h2><div class="sub" data-t="tsnote"></div></div>
      <div class="seg sm"><button id="tsY" class="on" data-t="yearly"></button><button id="tsM" data-t="monthly"></button></div></div>
    <div class="tsgrid"><div><h4 data-t="tsval"></h4><svg id="tsv"></svg></div><div><h4 data-t="tsvol"></h4><svg id="tsq"></svg></div></div>
  </section>

  <section class="block" id="ctblock">
    <div class="bh"><div><h2 id="cttitle"></h2><div class="sub" data-t="click_hint"></div></div></div>
    <table class="ct" id="ct"></table>
    <button class="more" id="more"></button>
  </section>

  <section class="block hide" id="cmpblock"></section>

  <footer id="foot"></footer>
</main>
<div class="tip" id="tip"></div>

<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script>
const T={
 hy:{brand:"Արտահանման և ներմուծման գներ · Հայաստան",ph:"Ապրանք կամ ԱՏԳ ԱԱ ծածկագիր (օր. 070200)",export:"Արտահանում",import:"Ներմուծում",
  m_price:"Գին",m_cmp:"Համեմատություն այլ երկրների հետ",
  dest_X:"Նշանակման երկիր",dest_M:"Ծագման երկիր",world:"Ամբողջ աշխարհ",year:"Տարի",
  armprice_X:"Հայաստանի արտահանման գինը",armprice_M:"Հայաստանի ներմուծման գինը",others:"Այլ երկրների միջինը",
  rankof:(r,n)=>r?`Հայաստանը ${r}-րդն է ${n} երկրից՝ ըստ գնի`:"Հայաստանը այս ուղղությամբ առևտուր չունի",noarm:"Հայաստան՝ առևտուր չկա",
  cmploading:"Այս ապրանքի համեմատության տվյալները դեռ ներբեռնվում են։ Ամեն գիշեր ավելանում են նոր տարիներ։",
  cmptitle_X:"Արտահանողները՝ ըստ գնի",cmptitle_M:"Ներմուծողները՝ ըստ գնի",
  regnote:"● Տարածաշրջանի երկիր։ Ցույց են տրված խոշորագույն արտահանողները և տարածաշրջանը։",regnoteM:"● Տարածաշրջանի երկիր։ Ցույց են տրված խոշորագույն ներմուծողները և տարածաշրջանը։",
  cmpsrc:y=>`Աղբյուր՝ ՄԱԿ Comtrade, տարեկան տվյալներ, ${y}։ Գին = արժեք ÷ քաշ։`,
  yearly:"Տարեկան",monthly:"Ամսական",tsval:"Արժեք, ԱՄՆ դոլար",tsvol:"Ծավալ, կգ",tstitle:"Արժեքը և ծավալը վերջին 5 տարում",
  tsnote:"Մուգ գույնով՝ գնի համար ընտրված ժամանակահատվածը։ * Տարին դեռ ամբողջական չէ։",
  avg_X:"Միջին արտահանման գին",avg_M:"Միջին ներմուծման գին",perkg:"$/կգ",perunit:u=>`$/${u}`,
  value:"Արժեք, $",qty:"Քաշ, կգ",ncountries:"Երկրներ",months:"Ամիսներ",
  filters:"Ֆիլտրեր",reset:"Վերականգնել",period:"Ժամանակահատված",
  p3:"3 ամիս",p12:"12 ամիս",p36:"3 տարի",pall:"Ամբողջը",outliers:"Բացառել ծայրահեղ գները",
  k:k=>({3:'Խիստ',5:'Միջին',10:'Մեղմ'})[k]+` (միջնարժեքից ×${k})`,outnote:n=>n?`Բացառվել է ${n} ամսական գրառում։`:"Ծայրահեղ գներ չկան։",

/* ---------- calculation ---------- */
function median(a){if(!a.length)return NaN;a=a.slice().sort((x,y)=>x-y);const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2}
function clean(rows){
  let small=0;if(minKg>0){const n=rows.length;rows=rows.filter(r=>r[3]>=minKg);small=n-rows.length}
  let removed=0;
  if(outOn){const uv=rows.filter(r=>r[3]>0).map(r=>r[2]/r[3]);const med=median(uv);
    if(isFinite(med)){const n=rows.length;rows=rows.filter(r=>!(r[3]>0)||((r[2]/r[3])<=med*outK&&(r[2]/r[3])>=med/outK));removed=n-rows.length}}
  return {rows,small,removed};
}
function compute(){
  const F=rec.f[flow];if(!F)return null;
  const c=clean(F.r.filter(r=>r[0]>=from&&r[0]<=to));
  const parts=new Map();
  for(const r of c.rows){let a=parts.get(r[1]);if(!a){a={c:r[1],v:0,vw:0,kg:0,vq:0,q:0,ms:new Set()};parts.set(r[1],a)}
    a.v+=r[2];if(r[3]>0){a.vw+=r[2];a.kg+=r[3]}if(r[4]>0){a.vq+=r[2];a.q+=r[4]}a.ms.add(r[0])}
  const tot={v:0,vw:0,kg:0,vq:0,q:0,ms:new Set(),n:0};
  for(const a of parts.values()){a.pkg=a.kg>0?a.vw/a.kg:null;a.pq=a.q>0?a.vq/a.q:null;
    if(excluded.has(a.c))continue;tot.v+=a.v;tot.vw+=a.vw;tot.kg+=a.kg;tot.vq+=a.vq;tot.q+=a.q;a.ms.forEach(m=>tot.ms.add(m));tot.n++}
  tot.pkg=tot.kg>0?tot.vw/tot.kg:null;tot.pq=tot.q>0?tot.vq/tot.q:null;
  return {tot,parts:[...parts.values()].sort((a,b)=>b.v-a.v),removed:c.removed,small:c.small,unit:F.u};
}

/* ---------- value and volume over time ---------- */
$('tsY').onclick=()=>{tsMode='Y';drawTS()};$('tsM').onclick=()=>{tsMode='M';drawTS()};
function drawTS(){
  $('tsY').classList.toggle('on',tsMode==='Y');$('tsM').classList.toggle('on',tsMode==='M');$('tstitle').textContent=t('tstitle');
  const F=rec.f[flow];if(!F)return;
  const end=maxM();
  const y0=+META.first.slice(0,4),m0=+META.first.slice(4)-1;
  const yearOf=i=>Math.floor((y0*12+m0+i)/12);
  const start=tsMode==='M'?Math.max(0,end-59):Math.max(0,(yearOf(end)-4)*12-(y0*12+m0));
  const rows=clean(F.r.filter(r=>r[0]>=start&&r[0]<=end&&!excluded.has(r[1]))).rows;
  let bins;
  if(tsMode==='M'){bins=[...Array(end-start+1).keys()].map(k=>({key:start+k,lab:mname(start+k),v:0,kg:0,sel:start+k>=from&&start+k<=to}));
    rows.forEach(r=>{const b=bins[r[0]-start];b.v+=r[2];b.kg+=r[3]})}
  else{const ys=[];for(let y=yearOf(start);y<=yearOf(end);y++)ys.push(y);
    bins=ys.map(y=>{const full=(y*12+11)<=(y0*12+m0+end);return {key:y,lab:full?String(y):`${y}*`,v:0,kg:0,sel:false}});
    rows.forEach(r=>{const b=bins[yearOf(r[0])-bins[0].key];if(b){b.v+=r[2];b.kg+=r[3]}});
    bins.forEach(b=>{b.sel=yearOf(from)<=b.key&&yearOf(to)>=b.key})}
  bars('#tsv',bins,'v');bars('#tsq',bins,'kg');
}
function bars(sel,bins,key){
  const el=d3.select(sel),w=el.node().getBoundingClientRect().width||500,h=220,m={l:58,r:6,t:8,b:26};
  el.attr('viewBox',`0 0 ${w} ${h}`).selectAll('*').remove();
  const x=d3.scaleBand().domain(bins.map(b=>b.key)).range([m.l,w-m.r]).padding(bins.length>20?.18:.32);
  const y=d3.scaleLinear().domain([0,d3.max(bins,b=>b[key])||1]).nice().range([h-m.b,m.t]);
  el.append('g').attr('class','ax').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(y).ticks(4).tickFormat(v=>t('vfmt')(v)).tickSize(-(w-m.l-m.r))).call(g=>g.select('.domain').remove());
  const every=Math.ceil(bins.length/8);
  el.append('g').attr('class','ax').attr('transform',`translate(0,${h-m.b})`).call(d3.axisBottom(x).tickValues(bins.filter((b,i)=>i%every===0).map(b=>b.key)).tickFormat(k=>bins.find(b=>b.key===k).lab).tickSize(0)).call(g=>g.select('.domain').remove()).selectAll('text').attr('dy','1.2em');
  el.append('g').selectAll('rect').data(bins).join('rect').attr('class',b=>'bar'+(b.sel?' sel':'')).attr('x',b=>x(b.key)).attr('width',x.bandwidth())
    .attr('y',b=>y(b[key])).attr('height',b=>y(0)-y(b[key])).attr('rx',3)
    .append('title').text(b=>`${b.lab}: ${t('vfmt')(b[key])}`);
}

/* ---------- compare with other countries ---------- */
const REGION=new Set([268,31,792,364,398,860,417,112,498,804]);
function renderCmp(fit){
  history.replaceState(null,'',location.pathname+location.search+`#${rec.hs}/${flow}`);
  const top=$('cmptop'),blk=$('cmpblock');
  const head=`<div class="pname"><span class="code">${rec.hs}</span>${prodName(rec)}</div>`;
  if(!CMP||!CMP.f||!CMP.f[flow]){top.innerHTML=head+`<div class="msg">${t('cmploading')}</div>`;blk.innerHTML='';clearCmpMap();return}
  const rows=CMP.f[flow], years=CMP.years;
  if(!cyear||!years.includes(cyear))cyear=years[years.length-1];
  const dests=[...new Set(rows.map(r=>r[2]))];
  const dv=new Map();rows.forEach(r=>{if(r[1]===51&&r[0]===cyear)dv.set(r[2],(dv.get(r[2])||0)+r[3])});
  const dlist=[0,...dests.filter(d=>d!==0).sort((a,b)=>(dv.get(b)||0)-(dv.get(a)||0))];
  if(!dlist.includes(dest))dest=0;
  const by=new Map();
  rows.forEach(r=>{if(r[0]!==cyear||r[2]!==dest||r[1]===dest)return;let a=by.get(r[1]);if(!a){a={c:r[1],v:0,kg:0};by.set(r[1],a)}a.v+=r[3];a.kg+=r[4]});
  let list=[...by.values()].filter(a=>a.kg>0&&a.v>0).map(a=>({...a,p:a.v/a.kg}));
  const totv=d3.sum(list,a=>a.v)||1;
  list=list.filter(a=>a.c===51||REGION.has(a.c)||a.v/totv>=0.002);
  const arm=list.find(a=>a.c===51);
  const others=list.filter(a=>a.c!==51);const avgO=d3.sum(others,a=>a.v)/(d3.sum(others,a=>a.kg)||1);
  const byP=[...list].sort((a,b)=>b.p-a.p);const rank=arm?byP.findIndex(a=>a.c===51)+1:0;
  let show=[...list].sort((a,b)=>b.v-a.v).slice(0,15);list.forEach(a=>{if((REGION.has(a.c)||a.c===51)&&!show.includes(a))show.push(a)});
  show.sort(csort==='p'?(a,b)=>b.p-a.p:(a,b)=>b.v-a.v);
  const maxp=d3.max(show,a=>a.p)||1;
  const dname=c=>c===0?t('world'):pname(c);
  top.innerHTML=head+`<div class="cmpctl"><div><label>${t('dest_'+flow)}</label><select id="cdest">${dlist.map(d=>`<option value="${d}" ${d===dest?'selected':''}>${dname(d)}</option>`).join('')}</select></div>
     <div><label>${t('year')}</label><select id="cyear">${years.slice().reverse().map(y=>`<option ${y===cyear?'selected':''}>${y}</option>`).join('')}</select></div></div>
   <div class="cmpbig"><div><div class="lab">${t('armprice_'+flow)} · ${dname(dest)} · ${cyear}</div><div class="v">${arm?fmtP(arm.p):'–'}<small>${t('perkg')}</small></div></div>
     <div><div class="lab">${t('others')}</div><div class="o">${fmtP(avgO)}<small>${t('perkg')}</small></div></div>
     <div class="rk">${t('rankof')(rank,list.length)}</div></div>`;
  blk.innerHTML=`<div class="bh"><div><h2>${t('cmptitle_'+flow)} · ${dname(dest)} · ${cyear}</h2><div class="sub">${flow==='X'?t('regnote'):t('regnoteM')}</div></div></div>
   <table class="ct"><tr><th>${t('country')}</th><th class="n ${csort==='p'?'on':''}" data-s="p">${t('price')} ↓</th><th></th><th class="n ${csort==='v'?'on':''}" data-s="v">${t('value')} ↓</th><th class="n">${t('qty')}</th></tr>
   ${show.map(a=>`<tr class="${a.c===51?'arm':''} ${REGION.has(a.c)?'reg':''}" data-c="${a.c}"><td class="nm">${pname(a.c)}</td><td class="n"><b>${fmtP(a.p)}</b></td><td class="pb"><span class="bar" style="width:${Math.max(1,100*a.p/maxp).toFixed(1)}%"></span></td><td class="n">${t('vfmt')(a.v)}</td><td class="n">${t('vfmt')(a.kg)}</td></tr>`).join('')}
   ${arm?'':`<tr class="arm"><td colspan="5">${t('noarm')}</td></tr>`}</table>
   <div class="note" style="margin-top:10px">${t('cmpsrc')(cyear)}</div>`;
  $('cdest').onchange=e=>{dest=+e.target.value;render(true)};$('cyear').onchange=e=>{cyear=+e.target.value;render()};
  blk.querySelectorAll('th[data-s]').forEach(th=>th.onclick=()=>{csort=th.dataset.s;render()});
  blk.querySelectorAll('tr[data-c]').forEach(el=>{el.style.cursor='default';el.onmouseenter=()=>hiRep(+el.dataset.c,true);el.onmouseleave=()=>hiRep(+el.dataset.c,false)});
  drawCmpMap(list,dest,fit);
}
function clearCmpMap(){gArcs.selectAll('*').remove();gDots.selectAll('.dot').remove();$('legend').innerHTML='';gLand.selectAll('path').classed('has',false).classed('off',false).classed('dest',false).style('fill',null).each(d=>{d.__a=null;d.__r=null})}
function hiRep(c,on){gArcs.selectAll('path.arc').filter(a=>a.c===c).classed('hi',on)}
function drawCmpMap(list,dest,fit){
  const dp=dest===0?null:PART.get(dest);
  const prices=list.map(a=>a.p).sort((x,y)=>x-y);
  const lo=prices.length?d3.quantile(prices,.05):1, hi_=prices.length?d3.quantile(prices,.95):2;
  const ramp=d3.scaleSequentialLog(d3.interpolateRgb(css('--ramp0'),css('--ramp1'))).domain([Math.max(lo,1e-6),Math.max(hi_,lo*1.01)]).clamp(true);
  const byNum=new Map();list.forEach(a=>{const p=PART.get(a.c);if(p&&p.n)byNum.set(p.n,a)});
  gLand.selectAll('path').each(function(d){const a=byNum.get(d.id);d.__a=null;d.__r=a||null;const s=d3.select(this);
    const isDest=dp&&dp.n===d.id;s.classed('has',!!a).classed('off',false).classed('dest',!!isDest).classed('arm',d.id==='051');
    s.style('fill',d.id==='051'||isDest?null:(a?ramp(a.p):null))});
  gLand.selectAll('path').on('mousemove',(e,d)=>{if(d.__r)showCmpTip(e,d.__r);else hideTip()}).on('click',null);
  const maxv=d3.max(list,a=>a.v)||1, w=d3.scaleSqrt().domain([0,maxv]).range([.8,10]), rr=d3.scaleSqrt().domain([0,maxv]).range([2,9]);
  const pts=list.map(a=>{const p=PART.get(a.c);return p&&p.lat!=null?{a,xy:proj([p.lon,p.lat])}:null}).filter(Boolean);
  const arcs=dp?pts:[];const [dx0,dy0]=dp?proj([dp.lon,dp.lat]):[0,0];
  const arcD=o=>{const [x,y]=o.xy;const dx=dx0-x,dy=dy0-y,dist=Math.hypot(dx,dy)||1;const bend=Math.min(.32,.18+40/dist);return `M${x},${y}Q${(x+dx0)/2-dy*bend},${(y+dy0)/2+dx*bend} ${dx0},${dy0}`};
  gArcs.selectAll('path.arc').data(arcs.map(o=>({...o,c:o.a.c})),d=>d.c).join('path').attr('class','arc').attr('d',arcD).style('stroke-width',o=>w(o.a.v)+'px')
    .style('stroke',o=>o.a.c===51?css('--accent'):null).style('stroke-opacity',o=>o.a.c===51?1:null)
    .on('mousemove',(e,o)=>{showCmpTip(e,o.a);d3.select(e.currentTarget).classed('hi',true)}).on('mouseleave',e=>{hideTip();d3.select(e.currentTarget).classed('hi',false)}).on('click',null);
  gArcs.selectAll('path.flow').data(arcs.map(o=>({...o,c:o.a.c})),d=>d.c).join('path').attr('class','flow').attr('d',arcD).style('stroke-width',o=>Math.max(1.2,w(o.a.v)*.45)+'px');
  gDots.selectAll('circle.dot').data(pts.map(o=>({x:o.xy[0],y:o.xy[1],r:rr(o.a.v)}))).join('circle').attr('class','dot').attr('cx',d=>d.x).attr('cy',d=>d.y);
  gDots.select('.homepulse').raise();gDots.select('.home').raise();scaleDots();
  $('legend').innerHTML=`<div><div>${t('price')}</div><div class="ramp" style="background:linear-gradient(90deg,${css('--ramp0')},${css('--ramp1')})"></div><div class="ends"><span>${fmtP(lo)}</span><span>${fmtP(hi_)}</span></div></div>`;
  $('empty').style.display='none';
  if(fit){const P2=[...pts.sort((a,b)=>b.a.v-a.a.v).slice(0,10).map(o=>o.xy),proj(YEREVAN)];if(dp)P2.push([dx0,dy0]);fitPts(P2,true)}
}
function showCmpTip(e,a){
  $('tip').innerHTML=`<h4>${pname(a.c)}</h4><div class="tp">${fmtP(a.p)} <small>${t('perkg')}</small></div><table><tr><td>${t('value')}</td><td>${t('vfmt')(a.v)}</td></tr><tr><td>${t('qty')}</td><td>${t('vfmt')(a.kg)}</td></tr></table>`;
  placeTip(e);
}

/* ---------- map ---------- */
let svg,gRoot,gLand,gArcs,gDots,proj,path,zoom,W=900,H=520,K=1;
function initMap(){
  svg=d3.select('#map');const box=$('mapbox');W=box.clientWidth||900;H=box.clientHeight||520;
  svg.attr('viewBox',`0 0 ${W} ${H}`);
  proj=d3.geoNaturalEarth1().fitExtent([[10,10],[W-10,H-10]],{type:'Sphere'});path=d3.geoPath(proj);
  gRoot=svg.append('g');gLand=gRoot.append('g');gArcs=gRoot.append('g');gDots=gRoot.append('g');
  gLand.selectAll('path').data(WORLD.features).join('path').attr('class','country').attr('d',path)
    .on('mousemove',(e,d)=>{const a=d.__a;if(a)showTip(e,a);else hideTip()}).on('mouseleave',hideTip)
    .on('click',(e,d)=>{if(d.__a)toggle(d.__a.c)});
  const [hx,hy]=proj(YEREVAN);
  gDots.append('circle').attr('class','homepulse').attr('cx',hx).attr('cy',hy).attr('r',6);
  gDots.append('circle').attr('class','home').attr('cx',hx).attr('cy',hy).attr('r',4);
  zoom=d3.zoom().scaleExtent([1,40]).filter(e=>e.type==='wheel'?(e.ctrlKey||e.metaKey||document.activeElement===svg.node()):!e.button).on('zoom',e=>{gRoot.attr('transform',e.transform);K=e.transform.k;scaleDots()});
  svg.attr('tabindex',0).call(zoom).on('dblclick.zoom',null);
  $('zin').onclick=()=>svg.transition().duration(350).call(zoom.scaleBy,1.6);
  $('zout').onclick=()=>svg.transition().duration(350).call(zoom.scaleBy,1/1.6);
  $('zfit').onclick=()=>mode==='cmp'?render(true):fitView(true);
}
function resizeMap(){const box=$('mapbox');if(!svg||(box.clientWidth===W&&box.clientHeight===H))return;svg.selectAll('*').remove();initMap()}
function scaleDots(){gDots.selectAll('.dot').attr('r',d=>d.r/K);gDots.select('.home').attr('r',4.5/K);gDots.select('.homepulse').attr('r',10/K)}
function drawMap(fit){
  const [hx,hy]=proj(YEREVAN);
  gLand.selectAll('path').classed('dest',false).each(d=>{d.__r=null}).on('mousemove',(e,d)=>{const a=d.__a;if(a)showTip(e,a);else hideTip()}).on('click',(e,d)=>{if(d.__a)toggle(d.__a.c)});
  gArcs.selectAll('path.arc').style('stroke',null).style('stroke-opacity',null);
  const parts=R.parts.filter(a=>PART.get(a.c)&&PART.get(a.c).lat!=null);
  const byNum=new Map();parts.forEach(a=>{const n=PART.get(a.c).n;if(n)byNum.set(n,a)});
  const prices=parts.filter(a=>!excluded.has(a.c)&&a.pkg).map(a=>a.pkg).sort((x,y)=>x-y);
  const lo=prices.length?d3.quantile(prices,.05):1, hi_=prices.length?d3.quantile(prices,.95):2;
  const ramp=d3.scaleSequentialLog(d3.interpolateRgb(css('--ramp0'),css('--ramp1'))).domain([Math.max(lo,1e-6),Math.max(hi_,lo*1.01)]).clamp(true);
  gLand.selectAll('path').each(function(d){const a=byNum.get(d.id);d.__a=a||null;
    const s=d3.select(this);s.classed('has',!!a).classed('off',!!a&&excluded.has(a.c)).classed('arm',d.id==='051');
    s.style('fill',d.id==='051'?null:(a&&!excluded.has(a.c)&&a.pkg?ramp(a.pkg):null))});
  const maxv=d3.max(parts,a=>a.v)||1, w=d3.scaleSqrt().domain([0,maxv]).range([.8,10]), rr=d3.scaleSqrt().domain([0,maxv]).range([2,8]);
  const vis=parts.filter(a=>!excluded.has(a.c)).sort((a,b)=>a.v-b.v);
  const arcD=a=>{const p=PART.get(a.c);const [x,y]=proj([p.lon,p.lat]);const dx=x-hx,dy=y-hy,dist=Math.hypot(dx,dy)||1;
    const bend=Math.min(.32,.18+40/dist);const cx=(hx+x)/2-dy*bend,cy=(hy+y)/2+dx*bend;return `M${hx},${hy}Q${cx},${cy} ${x},${y}`};
  gArcs.selectAll('path.arc').data(vis,a=>a.c).join('path').attr('class','arc').attr('d',arcD).style('stroke-width',a=>w(a.v)+'px')
    .on('mousemove',(e,a)=>{showTip(e,a);d3.select(e.currentTarget).classed('hi',true)}).on('mouseleave',e=>{hideTip();d3.select(e.currentTarget).classed('hi',false)})
    .on('click',(e,a)=>toggle(a.c));
  gArcs.selectAll('path.flow').data(vis,a=>a.c).join('path').attr('class','flow'+(flow==='M'?' rev':'')).attr('d',arcD).style('stroke-width',a=>Math.max(1.2,w(a.v)*.45)+'px');
  gDots.selectAll('circle.dot').data(vis.map(a=>{const p=PART.get(a.c);const [x,y]=proj([p.lon,p.lat]);return {x,y,r:rr(a.v)}}))
    .join('circle').attr('class','dot').attr('cx',d=>d.x).attr('cy',d=>d.y);
  gDots.select('.homepulse').raise();gDots.select('.home').raise();scaleDots();
  $('empty').style.display=vis.length?'none':'flex';$('empty').textContent=t('nodata');
  $('legend').innerHTML=`<div><div>${t('price')}</div><div class="ramp" style="background:linear-gradient(90deg,${css('--ramp0')},${css('--ramp1')})"></div><div class="ends"><span>${fmtP(lo)}</span><span>${fmtP(hi_)}</span></div></div>
    <div><div>${t('width')}</div><svg width="90" height="16"><line x1="2" x2="28" y1="12" y2="12" stroke-width="1"/><line x1="34" x2="60" y1="10" y2="10" stroke-width="4"/><line x1="66" x2="88" y1="9" y2="9" stroke-width="8"/></svg></div>`;
  if(fit)fitView(true);
}
function fitView(anim){
  const vis=R.parts.filter(a=>!excluded.has(a.c)&&PART.get(a.c)&&PART.get(a.c).lat!=null);
  let cum=0;const sum=d3.sum(vis,a=>a.v)||1;const core=vis.filter((a,i)=>{const take=i<4||cum/sum<.9;cum+=a.v;return take});
  fitPts([YEREVAN,...core.map(a=>[PART.get(a.c).lon,PART.get(a.c).lat])].map(p=>proj(p)),anim);
}
function fitPts(pts,anim){
  const [x0,y0,x1,y1]=[d3.min(pts,p=>p[0]),d3.min(pts,p=>p[1]),d3.max(pts,p=>p[0]),d3.max(pts,p=>p[1])];
  const pad=30, aw=W-2*pad, ah=H-2*pad-30;
  let k=Math.min(aw/Math.max(x1-x0,80),ah/Math.max(y1-y0,60))*.85;k=Math.max(1,Math.min(k,12));
  const tr=d3.zoomIdentity.translate(pad+aw/2-k*(x0+x1)/2,pad+ah/2-k*(y0+y1)/2).scale(k);
  (anim?svg.transition().duration(800):svg).call(zoom.transform,tr);
}
function showTip(e,a){
  const off=excluded.has(a.c);
  const unit=R.unit&&T[L].units[R.unit]?T[L].units[R.unit]:R.unit;
  $('tip').innerHTML=`<h4>${pname(a.c)}</h4>${a.pkg?`<div class="tp">${fmtP(a.pkg)} <small>${t('perkg')}</small></div>`:`<div>${t('noprice')}</div>`}
   <table>${a.pq?`<tr><td>${t('perunit')(unit)}</td><td>${fmtP(a.pq)}</td></tr>`:''}<tr><td>${t('value')}</td><td>${t('vfmt')(a.v)}</td></tr><tr><td>${t('qty')}</td><td>${t('vfmt')(a.kg)}</td></tr>
   <tr><td>${t('share')}</td><td>${off?'–':(100*a.v/(R.tot.v||1)).toFixed(1)+'%'}</td></tr><tr><td>${t('months')}</td><td>${a.ms.size}</td></tr></table>
   <div class="act">${off?t('click_on'):t('click_off')}</div>`;
  placeTip(e);
}
function placeTip(e){const tip=$('tip');let x=e.clientX+16,y=e.clientY+16;if(x+250>innerWidth)x-=270;if(y+210>innerHeight)y-=220;tip.style.left=x+'px';tip.style.top=y+'px';tip.style.opacity=1}
function hideTip(){$('tip').style.opacity=0}
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{resizeMap();if(rec)render(true)},250)});
</script>
